<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#14120e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4ecda" media="(prefers-color-scheme: light)" />
  <title>GeoLearner</title>
  <style>html{background:#14120e}#loader{z-index:10;color:#eae5da;letter-spacing:.3em;background:#14120e;flex-direction:column;justify-content:center;align-items:center;gap:18px;font:11px/1 ui-monospace,Geist Mono,monospace;transition:opacity .6s;display:flex;position:fixed;inset:0}html.paper,html.paper #loader{background:#f4ecda}html.paper #loader{color:#1f1c16}#loader.gone{opacity:0;pointer-events:none}#loader div{opacity:.7;animation:1.8s ease-in-out infinite alternate loader-breathe}@keyframes loader-breathe{0%{opacity:.35}to{opacity:.8}}</style>
  <script>
    // pick paper or dark before anything paints: the saved switch, or the device on Auto
    try { var t = localStorage.getItem('geolearner.theme'); } catch (e) {}
    if (t === 'light' || (t !== 'dark' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('paper');
  </script>
  <!-- start the data downloads alongside the script instead of after it -->
  <link rel="preload" href="./data/world.json" as="fetch" crossorigin />
  <link rel="preload" href="./data/wind.json" as="fetch" crossorigin />
  <link rel="preload" href="./data/rivers.json" as="fetch" crossorigin />
  <link rel="preload" href="./data/sky.json" as="fetch" crossorigin />
  <script type="module" crossorigin src="./assets/index-BPJdU5qx.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-IpbBOQci.css">
</head>
<body data-mode="explore">
  <div id="loader" aria-label="Loading">
    <svg viewBox="0 0 100 100" width="96" height="96" fill="none" stroke="currentColor" stroke-width="0.9">
      <circle cx="50" cy="50" r="34"/><ellipse cx="50" cy="50" rx="34" ry="5" opacity="0.55"/><ellipse cx="50" cy="33" rx="29.4" ry="4.3" opacity="0.55"/><ellipse cx="50" cy="67" rx="29.4" ry="4.3" opacity="0.55"/><ellipse cx="50" cy="50" rx="34" ry="34"><animate attributeName="rx" dur="3.6s" begin="-0.0s" repeatCount="indefinite" values="0;34;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></ellipse><ellipse cx="50" cy="50" rx="34" ry="34"><animate attributeName="rx" dur="3.6s" begin="-1.2s" repeatCount="indefinite" values="0;34;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></ellipse><ellipse cx="50" cy="50" rx="34" ry="34"><animate attributeName="rx" dur="3.6s" begin="-2.4s" repeatCount="indefinite" values="0;34;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></ellipse>
      <ellipse cx="50" cy="50" rx="43" ry="6" opacity="0.4" transform="rotate(-23.44 50 50)" stroke-dasharray="1 2"/>
    </svg>
    <div>GEOLEARNER</div>
  </div>
  <div id="stage"></div>
  <header class="hud top">
    <div class="brand">GEOLEARNER</div>
    <nav id="modes" aria-label="Mode">
      <button data-mode="explore" class="on">Explore</button>
      <button data-mode="learn">Learn</button>
      <button data-mode="daily">Daily</button>
      <button data-mode="atlas">Atlas</button>
    </nav>
    <nav id="chips"></nav>
    <div class="winds-box">
      <div class="toggles">
        <button id="rivers" class="toggle on" aria-pressed="true">Rivers</button>
        <button id="winds" class="toggle on" aria-pressed="true">Winds</button>
      </div>
      <div id="winds-source"></div>
    </div>
  </header>
  <div class="hud bottom">
    <div id="hover"></div>
    <section id="panel" hidden aria-live="polite"></section>
    <div class="foot">
      <div class="hint">drag to spin · click a country · zoom out for space</div>
      <div id="theme" role="radiogroup" aria-label="Appearance">
        <button data-theme="auto" role="radio">Auto</button>
        <button data-theme="light" role="radio">Light</button>
        <button data-theme="dark" role="radio">Dark</button>
      </div>
    </div>
  </div>
  <div id="wind-labels"></div>
  <div id="river-labels"></div>
  <div id="known-labels"></div>
  <div id="peaks"></div>
  <div id="arc-label" hidden></div>
  <aside id="card" hidden>
    <button id="close" aria-label="Close">×</button>
    <div class="name"></div>
    <div class="meta"></div>
    <div class="about"></div>
    <div class="capital"></div>
    <div class="pop"></div>
    <div class="peak"></div>
    <div class="from"></div>
    <div class="fact" hidden><span class="fact-text"></span><span class="cite">CIA World Factbook</span></div>
  </aside>
</body>
</html>
